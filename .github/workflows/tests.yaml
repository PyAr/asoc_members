name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: 3.9
      - name: Bootstrap everything
        run: |
          docker compose up -d
          # Silence exec errors while postgres is mid-restart on initdb; just retry until it's ready.
          for i in $(seq 1 60); do docker compose exec -T postgres pg_isready -U postgres >/dev/null 2>&1 && break; sleep 1; done
          docker compose exec -T web pip install -r /code/config/requirements-dev.txt
      - name: DEBUG network diagnostics
        run: |
          docker network inspect asoc_members_default
          docker compose exec -T web cat /etc/resolv.conf
          docker compose exec -T web cat /etc/hosts
          docker compose exec -T web getent hosts postgres || true
          docker compose exec -T web python3 -c "import socket; print(socket.gethostbyname('postgres'))" || true
      - name: Run tests
        run: |
          # Don't use "docker compose start" here: restarting a networked container breaks service DNS resolution.
          docker compose exec -T web ./manage.py test -v2 --noinput

