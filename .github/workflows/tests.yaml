name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python 3.9
        uses: actions/setup-python@v6
        with:
          python-version: 3.9
      - name: Bootstrap everything
        run: |
          docker compose up -d
          # Wait for postgres's internal initdb restart; otherwise compose v2's embedded DNS can break.
          timeout 60 bash -c 'until docker compose exec -T postgres pg_isready -U postgres; do sleep 1; done'
          docker compose exec -T web pip install -r /code/config/requirements-dev.txt
      - name: Run tests
        run: |
          # Don't use "docker compose start" here: restarting a networked container breaks service DNS resolution.
          docker compose exec -T web ./manage.py test -v2 --noinput

