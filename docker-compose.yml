volumes:
  pgdata:

services:
  postgres:
    image: postgres:11.5
    restart: always
    environment:
      - POSTGRES_DB=postgres
      - POSTGRES_USER=asoc_members
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data/

  web:
    build: .
    image: asoc_members/web:latest
    ports:
      - "8127:8127"
    volumes:
      - .:/code
    command: "tail -f /dev/null"

  mail:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@mail.com
      - PGADMIN_DEFAULT_PASSWORD=admin
