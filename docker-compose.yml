version: '2'

volumes:
  pgdata:

services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_DB=memberships
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data/

  web:
    build: .
    ports:
      - "8127:8127"
    volumes:
      - .:/code
    command: "tail -f /dev/null"
    # Compose v2's embedded DNS is unreliable on some hosts; links writes postgres's IP to /etc/hosts instead.
    links:
      - postgres

  mail:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
