version: '2'

volumes:
  pgdata:

# Static subnet so postgres can get a fixed IP: its container doesn't reliably
# register in the network's DNS/discovery map on some Docker Engine versions.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

services:
  postgres:
    image: postgres:latest
    restart: always
    environment:
      - POSTGRES_DB=memberships
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data/
    networks:
      default:
        ipv4_address: 172.28.0.10

  web:
    build: .
    ports:
      - "8127:8127"
    volumes:
      - .:/code
    command: "tail -f /dev/null"
    environment:
      # Bypass DNS resolution entirely and hit postgres's fixed IP directly.
      - POSTGRES_HOST=172.28.0.10

  mail:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
