version: '2'

volumes:
  pgdata:

services:
  postgres:
    # Pinned: postgres 18+ changed its expected data dir layout and refuses to
    # start against a volume mounted directly at /var/lib/postgresql/data.
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_DB=memberships
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data/

  web:
    build: .
    ports:
      - "8127:8127"
    volumes:
      - .:/code
    command: "tail -f /dev/null"

  mail:
    image: mailhog/mailhog
    ports:
      - "8025:8025"
