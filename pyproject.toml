[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asoc_members"
version = "0.1.0"
description = "Memberships management for the Python Argentina's ONG"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Asociación Civil Python Argentina", email = "presidencia@ac.python.org.ar" }
]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "httplib2>=0.22.0",
    "certg==4.2",
    "certifi>=2020.4.5.1",
    "oauth2client==4.1.3",
    "django-configurations==2.5.1",
    "django-crispy-forms==2.1",
    "crispy-bootstrap4==2024.1",
    "logassert==4",
    "factory_boy==3.2.0",
    "flake8==3.7.7",
    "pytz==2024.1",
    "diff-match-patch==20230430",
    "django-extensions==3.2.3",
    "django-reversion-compare==0.16.0",
    "django-storages[azure]==1.14.6",
    "django==4.2.16",
    "google-api-python-client==2.149.0",
    "gunicorn==23.0.0",
    "mercadopago==3.1.1",
    "oauth2client==4.1.3",
    "Pillow==10.4.0",
    "psycopg[binary]>=3.2.10",
    "python-stdnum==1.20",
    "rapidtables==0.1.12",
    "sentry-sdk==2.16.0",
]

[dependency-groups]
dev = [
    "ipdb==0.13.9",
    "ipython==8.10.0",
]
